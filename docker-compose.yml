version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mu_cpcs_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cpcs_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mu_cpcs_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/cpcs_db?schema=public"
      JWT_SECRET: "supersecret_cpcs_jwt_signing_key_2026"
      FRONTEND_URL: "http://localhost:5173"
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mu_cpcs_frontend
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  pgdata:
